<section class="solicitacao">

  <h1>Nova solicitação</h1>

  @if (itens.length === 0) {

    <p>
      Nenhum item foi adicionado à solicitação.
    </p>

  } @else {

    <div class="lista-itens">

      @for (item of itens; track item.id) {

        <div class="item">

          <img
            [src]="item.imagem"
            [alt]="item.nome"
          >

          <div>
            <h2>{{ item.nome }}</h2>

            <p>
              {{ item.categoria }}
            </p>
          </div>

          <button
            (click)="removerItem(item.id)"
          >
            Remover
          </button>

        </div>

      }

    </div>

    <div class="formulario">
      
    <label for="finalidade">Finalidade da solicitação</label>

    <textarea
    id="finalidade"
    [(ngModel)]="finalidade"
    placeholder="Informe para qual atividade os itens serão utilizados"
    ></textarea>

    <label for="professor">Professor responsável</label>

    <select
    id="professor"
    [(ngModel)]="professorSelecionado"
    >
    <option value="">
      Selecione um professor
    </option>
    
    @for (professor of professores; track professor) {
      <option [value]="professor">
        {{ professor }}
      </option>
    }
    </select>

    <button
    class="enviar"
    (click)="enviarSolicitacao()"
    >Enviar solicitação
    </button>
  </div>
  }

</section>
